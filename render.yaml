# Render Blueprint for the API: New -> Blueprint -> pick the GitHub repo.
# The frontend is deployed on Vercel (see frontend/vercel.json); the database is Supabase.
# Secrets marked sync:false are asked for in the Render dashboard on first deploy.
services:
  - type: web
    name: charm-studio-api
    runtime: python
    plan: free # without this, Blueprints create a paid instance. Change to "starter" for always-on.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Supabase Session pooler URI
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://charm-studio.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false # optional, e.g. https://charm-studio-[a-z0-9]+-yourteam\.vercel\.app for preview deploys
      - key: AUTH_SECRET
        generateValue: true # signs logins and encrypts saved WhatsApp tokens; don't change once numbers are saved
      - key: ADMIN_PASSWORD
        sync: false # first login only; afterwards you use the email + password set in the app
      - key: RESEND_API_KEY
        sync: false # optional: turns on "Forgot password?" emails (resend.com)
      - key: FRONTEND_URL
        sync: false # your Vercel URL; reset links point here
      - key: AI_PROVIDER
        value: anthropic # or: ollama
      - key: ANTHROPIC_API_KEY
        sync: false # needed when AI_PROVIDER=anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5 # cheapest for reading chats; remove to use the default Sonnet
      - key: OLLAMA_API_KEY
        sync: false # needed when AI_PROVIDER=ollama (Ollama Cloud)
      - key: OLLAMA_MODEL
        sync: false # needed when AI_PROVIDER=ollama
      - key: WA_GRAPH_VERSION
        value: v20.0
      - key: WA_VERIFY_TOKEN
        generateValue: true
      # WhatsApp numbers are added in the app (Settings -> WhatsApp numbers).
      # Emergency login: add RESET_PASSWORD by hand only when locked out, then remove it.
